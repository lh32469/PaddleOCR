apiVersion: apps/v1
kind: Deployment
metadata:
  name: paddleocr
  labels:
    app: paddleocr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paddleocr
  template:
    metadata:
      labels:
        app: paddleocr
    spec:
      containers:
        - name: paddleocr
          image: localhost:32000/paddleocr:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          # Delay covers model download (~15 MB) + PaddleOCR warm-up on first start.
          # Models are cached in the container after the first pod run.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 12
      # Prevent OOM-killed pods from cycling too fast while a neighbour handles load.
      terminationGracePeriodSeconds: 60
